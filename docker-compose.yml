# docker-compose.yml — local dev stack (Postgres + api + frontend). Real keys load from .env (gitignored).
services:
  postgres:
    image: postgres:15
    container_name: bonza_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bonza
      POSTGRES_PASSWORD: bonza_dev
      POSTGRES_DB: bonza
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bonza -d bonza"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://bonza:bonza_dev@postgres:5432/bonza
      PORT: 5000
    env_file:
      - .env
    ports:
      - "5000:5000"
    volumes:
      - ./src/backend:/app/src/backend
    depends_on:
      postgres:
        condition: service_healthy
    command: npx nodemon src/backend/server.js

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      VITE_API_URL: http://localhost:5000
    volumes:
      - ./src/frontend:/app/src/frontend
      - /app/src/frontend/node_modules
      - ./.env:/app/.env:ro
    depends_on:
      - api

volumes:
  postgres_data:
