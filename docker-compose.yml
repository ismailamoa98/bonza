services:
  postgres:
    image: postgres:15
    container_name: bonza_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bonza
      POSTGRES_PASSWORD: bonza_dev
      POSTGRES_DB: bonza
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
