<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bonza — System status</title>
    <meta name="description" content="Live status of Bonza's services." />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Phase 27 §27l — the standalone status page. Plain HTML + one small external script (status.js), served
      straight from S3/CloudFront, so it renders even if the React app bundle is broken. It fetches
      /api/v1/status and degrades gracefully if the API is unreachable too. Inline styles only (no framework);
      no inline script (CSP-clean: script-src 'self').
    -->
    <style>
      :root { --terra: #da7756; --cream: #f4f3ee; --ink: #2a2420; --muted: #6a6258; --green: #1e7e40; --amber: #b45309; --red: #b91c1c; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--cream); color: var(--ink); -webkit-font-smoothing: antialiased; }
      .wrap { max-width: 640px; margin: 0 auto; padding: 48px 16px 64px; }
      header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
      .logo { width: 28px; height: 28px; border-radius: 7px; background: var(--terra); }
      h1 { font-size: 1.5rem; margin: 0; }
      .sub { color: var(--muted); margin: 4px 0 28px; }
      .overall { border-radius: 14px; padding: 18px 20px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.06); margin-bottom: 20px; font-weight: 600; display: flex; align-items: center; gap: 12px; }
      .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; background: var(--muted); }
      .ok { background: var(--green); } .degraded { background: var(--amber); } .outage { background: var(--red); }
      ul { list-style: none; padding: 0; margin: 0; }
      li { display: flex; justify-content: space-between; align-items: center; background: #fff; border-radius: 12px; padding: 14px 18px; margin-bottom: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
      .name { font-weight: 500; }
      .state { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .9rem; text-transform: capitalize; }
      footer { color: var(--muted); font-size: .85rem; margin-top: 28px; }
      a { color: var(--terra); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="logo" aria-hidden="true"></div>
        <h1>Bonza status</h1>
      </header>
      <p class="sub">Live status of our services. This page is hosted independently of the app.</p>

      <div id="overall" class="overall"><span class="dot" id="overall-dot"></span><span id="overall-text">Checking…</span></div>
      <ul id="services"></ul>

      <footer>
        Updated <span id="updated">—</span>. For help, visit <a href="/help">the help centre</a> or
        <a href="/help/contact">contact us</a>.
      </footer>
    </div>
    <script src="/status.js"></script>
  </body>
</html>
